<!doctype html><html><head><meta charset="utf-8"><title>Login · Social Autopilot</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main style="max-width:420px;margin-top:12vh"><div class="card"><h2>Social Autopilot</h2>
