        function glow(c, x, y, r, a, col) {
          var g = c.createRadialGradient(x, y, 0, x, y, r);
          for (var i = 0; i <= 10; i++) { var u = i / 10, f = Math.exp(-5 * u * u) * (1 - F.sstep((u - 0.8) / 0.2)); g.addColorStop(u, S.rgba(col, a * f)); }
          c.save(); c.globalCompositeOperation = "screen"; c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.restore();
        }

        /* the shape of the line at time t: which route, mid-morph, how far drawn */
        var anchorCache = null;
        function lineShape(t, R, Rf) {
          var ms = F.MORPHS, cur = "line", i;
          for (i = 0; i < ms.length; i++) { if (t >= ms[i].t1) cur = ms[i].to; }
          var active = null; for (i = 0; i < ms.length; i++) if (t > ms[i].t0 && t < ms[i].t1) active = ms[i];
          function pts(name, RR) { return name === "sting" ? stingTarget : sample((RR || R)[name], NS); }
          if (!active) return { pts: pts(cur), name: cur };
          var a = pts(active.from, Rf), b = pts(active.to, R), n = Math.min(a.length, b.length), out = new Array(n);
          var raw = (t - active.t0) / (active.t1 - active.t0);
          for (i = 0; i < n; i++) {
            var u = i / (n - 1), m = F.eInOut(F.clamp((raw - 0.4 * u) / 0.6));
            var ia = Math.round(i * (a.length - 1) / (n - 1)), ib = Math.round(i * (b.length - 1) / (n - 1));
            out[i] = [F.lerp(a[ia][0], b[ib][0], m), F.lerp(a[ia][1], b[ib][1], m)];
          }
          return { pts: out, name: "morph", active: active, raw: raw };
        }

        function drawLine(c, t, R, Rf) {
          var shape = lineShape(t, R, Rf), pts = shape.pts, n = pts.length;
          var w = F.lerp(14, sc5 ? sc5.w : 40, F.sstep((t - T.morphA) / (T.morphB - T.morphA)));
          var vis = n - 1, headP = null, i0 = 0, DOTX = 110;
          if (t < T.headDone + 0.02) {                      // the line is drawn out of the dot, across the frame
            var hx = F.lerp(DOTX, 2010, F.headX(t)); vis = 0;
            for (var i = 0; i < n; i++) { if (pts[i][0] <= hx) vis = i; else break; }
            for (var i2 = 0; i2 < n; i2++) { if (pts[i2][0] >= DOTX) { i0 = i2; break; } }
            headP = pts[Math.max(0, vis)];
          } else if (t < T.headDone + 0.6) {                // then it reaches back off the left edge
            var sx = F.lerp(DOTX, -700, F.eOut((t - T.headDone) / 0.5));
            for (var i3 = 0; i3 < n; i3++) { if (pts[i3][0] >= sx) { i0 = i3; break; } }
          }
          if (t >= T.dotIn) {
            c.save(); c.lineJoin = "round"; c.lineCap = "butt"; c.lineWidth = w; c.strokeStyle = COL.amber;
            if (t >= T.go && vis > i0) { c.beginPath(); c.moveTo(pts[i0][0], pts[i0][1]); for (var k = i0 + 1; k <= vis; k++) c.lineTo(pts[k][0], pts[k][1]); c.stroke(); }
            if (headP && t >= T.go && t < T.headDone) {
              glow(c, headP[0], headP[1], 70, 0.30, COL.amber);
              octagon(c, headP[0], headP[1], w * 1.5, COL.amber);
            } else if (t < T.go) {
              var fl = Math.exp(-(t - T.dotIn) / 0.18);
              var dp = extend(pts[0], pts[pts.length - 1], 110);
              glow(c, dp[0], dp[1], 80, 0.22 + 0.5 * fl, COL.amber);
              octagon(c, dp[0], dp[1], 26, COL.amber);
            }
            c.restore();
          }
          return shape;
        }

        /* the pulse that runs the connected thread */
        function drawPulse(c, t, R, shape) {
          if (t < F.pulseTimes[0] || t > T.checks[2] + 0.5 || shape.name !== "r3") return;
          var fr = R.r3.fr; if (!fr) return;
          var pt = F.pulseTimes, u;
          if (t <= pt[1]) u = F.lerp(fr[0], fr[1], F.eInOut((t - pt[0]) / (pt[1] - pt[0])));
          else if (t <= pt[2]) u = F.lerp(fr[1], fr[2], F.eInOut((t - pt[1]) / (pt[2] - pt[1])));
          else if (t <= pt[3]) u = F.lerp(fr[2], fr[3], F.eInOut((t - pt[2]) / (pt[3] - pt[2])));
          else u = fr[3];
          var p = R.r3.at(u); glow(c, p[0], p[1], 60, 0.45, COL.hot); octagon(c, p[0], p[1], 24, COL.hot);
        }

        /* ================= the tagline (hard-edged, character by character) ================= */
        var TAG_FONT = "italic 500 46px Lora, Georgia, serif", MONO_FONT = '600 26px "IBM Plex Mono", monospace';
        var tagAdv = [], tagW = 0, labAdv = [], labW = 0;
        function measureText2() {
          measure.font = TAG_FONT; measure.letterSpacing = "0.8px"; tagW = measure.measureText(F.WORDS.tagline).width; tagAdv = [];
          for (var i = 0; i <= F.WORDS.tagline.length; i++) tagAdv.push(measure.measureText(F.WORDS.tagline.slice(0, i)).width);
          measure.font = MONO_FONT; measure.letterSpacing = "3.5px"; labW = measure.measureText(F.WORDS.label).width; labAdv = [];
          for (var j = 0; j <= F.WORDS.label.length; j++) labAdv.push(measure.measureText(F.WORDS.label.slice(0, j)).width);
          measure.letterSpacing = "0px";
        }
        function typeWipe(c, text, adv, W, font, track, y, t0, t1, t, color) {
          if (t < t0) return;
          var p = F.eInOutSine((t - t0) / (t1 - t0)), n = text.length;
          c.save(); c.font = font; c.letterSpacing = track; c.textBaseline = "alphabetic"; c.textAlign = "left"; c.fillStyle = color;
          for (var i = 0; i < n; i++) {
            var f = F.clamp(p * (n + 1.5) - i); if (f <= 0) break;
            var x0 = 960 - W / 2 + adv[i], x1 = 960 - W / 2 + adv[i + 1];
            c.save(); c.beginPath(); c.rect(x0 - 2, y - 60, (x1 - x0) * Math.min(1, f) + 4, 90); c.clip(); c.fillText(text[i], x0, y); c.restore();
          }
          c.restore();
        }

        function drawFinal(c, t) {
          c.save();
          var k = F.clamp((t - T.darkA) / 4), sc = 1 + 0.028 * k;
          c.translate(960, 560); c.scale(sc, sc); c.translate(-960, -560);
          S.drawScene(sc5, c, F.tsOf(t));
          var tb = sc5.bottom;
          typeWipe(c, F.WORDS.tagline, tagAdv, tagW, TAG_FONT, "0.8px", tb + 112, F.tfOf(S.T.tagA), F.tfOf(S.T.tagB), t, COL.stone);
          typeWipe(c, F.WORDS.label, labAdv, labW, MONO_FONT, "3.5px", tb + 196, F.tfOf(S.T.tagB) + 0.05, F.tfOf(S.T.tagB) + 0.5, t, COL.stone);
          c.restore();
        }

        /* ================= one frame ================= */
        function setText(el, s) { if (el._s !== s) { el.innerHTML = s; el._s = s; } }
        var bandRow, subRow;
        function update(t) {
          var cam = F.camera(t);
          world.style.transform = "translate3d(" + (-cam.px).toFixed(2) + "px," + (-cam.py).toFixed(2) + "px," + cam.dz.toFixed(2) + "px) rotateX(" + cam.rx.toFixed(3) + "deg) rotateY(" + cam.ry.toFixed(3) + "deg)";

          // headline band + sub row
          var pose = F.eInOut((t - 3.0) / 0.8);
          var by = F.lerp(-170, -326, pose), bs = F.lerp(1, 0.78, pose), bz = F.lerp(-40, -120, pose);
          band.style.transform = "translate3d(0," + by.toFixed(2) + "px," + bz.toFixed(2) + "px) scale(" + bs.toFixed(4) + ")";
          band.style.filter = "blur(" + (pose * 0.9).toFixed(2) + "px)";
          bandRow.update(t); subRow.update(t);
          subEl.style.transform = "translate3d(0,60px,-20px)";

          // ghost notes
          for (var g = 0; g < ghosts.length; g++) {
            var gg = ghosts[g], dr = Math.sin(t * 0.18 + gg.ph);
            gg.el.style.transform = "translate3d(" + (gg.x + dr * 40).toFixed(1) + "px," + (gg.y + Math.cos(t * 0.15 + gg.ph) * 24).toFixed(1) + "px," + gg.z + "px) rotateY(" + gg.ry + "deg) rotateZ(" + gg.rz + "deg)";
            var bl = Math.min(16, Math.abs(gg.z + cam.dz) * 0.011);
            if (gg.el._b !== bl.toFixed(1)) { gg.el.style.filter = "blur(" + bl.toFixed(1) + "px)"; gg.el._b = bl.toFixed(1); }
          }

          // the window
          var open = F.winOpen(t), col = F.winCollapse(t);
          var yaw = F.winYaw(t), pitch = F.winPitch(t);
          win.style.transform = "translate3d(0,112px,0) rotateX(" + (-pitch).toFixed(3) + "deg) rotateY(" + yaw.toFixed(3) + "deg) scale(" + (1).toFixed(3) + "," + (0.93 * Math.max(0.004, col)).toFixed(4) + ")";
          var clip = open >= 1 ? "none" : "inset(" + ((1 - open) * 50).toFixed(2) + "% 0 " + ((1 - open) * 50).toFixed(2) + "% 0)";
          if (front._c !== clip) { front.style.clipPath = clip; back.style.clipPath = clip; front._c = clip; }
          win.style.display = (t < T.openA - 0.02) ? "none" : "block";

          // worksheet: the sentence is typed
          var n = F.typedCount(F.SENT_T, t), typed = F.WORDS.sentence.slice(0, n);
          var caretOn = (t < F.SENT_T[F.SENT_T.length - 1] + 0.3) || (Math.floor(t * 2) % 2 === 0);
          setText($("sentence"), typed.replace(/&/g, "&amp;") + (t >= T.sentA - 0.4 && t < T.scrollA ? '<span class="caret" style="opacity:' + (caretOn ? 1 : 0) + '"></span>' : ""));
          // scroll to the scorecard
          var sp = F.eInOut((t - T.scrollA) / (T.scrollB - T.scrollA));
          $("scroll").style.transform = "translateY(" + (-sp * 636).toFixed(2) + "px)";
          // the thread reaches each habit
          for (var r = 0; r < 3; r++) {
            var dt = t - T.checks[r], on = dt >= 0;
            rowEls[r].box.style.background = on ? COL.amber : "#FBF9F4"; rowEls[r].box.style.borderColor = on ? COL.amber : COL.ink;
            rowEls[r].tick.style.opacity = on ? 1 : 0; rowEls[r].tick.style.borderColor = on ? COL.ink : COL.ink;
            var pop = on && dt < 0.3 ? 1 + 0.16 * Math.sin(Math.PI * dt / 0.3) : 1; rowEls[r].box.style.transform = "scale(" + pop.toFixed(3) + ")";
          }
          // the email comes back: a focus pull
          var pulls = [["subject", 0], ["quote", 0.18], ["weekLab", 0.55], ["weekSq", 0.62], ["emailBtn", 0.72]];
          for (var pi = 0; pi < pulls.length; pi++) {
            var pe = $(pulls[pi][0]), e = F.eOut5(F.clamp((t - T.emailA - pulls[pi][1]) / 1.0)), b = 18 * (1 - e), s2 = 0.93 + 0.07 * e;
            pe.style.filter = b > 0.05 ? "blur(" + b.toFixed(2) + "px)" : "none"; pe.style.transform = "scale(" + s2.toFixed(4) + ")"; pe.style.transformOrigin = "left center";
          }

          // the pill is pressed
          var pd = t - T.press, pp = pd >= 0 && pd < 0.4 ? Math.sin(Math.PI * Math.min(1, pd / 0.4)) : 0, sp2 = $("savePill");
          sp2.style.transform = "scale(" + (1 - 0.06 * pp).toFixed(4) + ")"; sp2.style.background = pd >= 0 && pd < 0.55 ? COL.amber : COL.ink; sp2.style.borderColor = pd >= 0 && pd < 0.55 ? COL.amber : COL.ink; sp2.style.color = pd >= 0 && pd < 0.55 ? COL.ink : COL.cream;
          var p2d = t - T.press2, p2 = p2d >= 0 && p2d < 0.4 ? Math.sin(Math.PI * Math.min(1, p2d / 0.4)) : 0, eb = $("emailBtn");
          if (p2d >= 0) { eb.style.transform = "scale(" + (1 - 0.06 * p2).toFixed(4) + ")"; eb.style.background = p2d < 0.55 ? COL.amber : "transparent"; eb.style.borderColor = p2d < 0.55 ? COL.amber : COL.ink; }
          // 3 of 5 fills in
          for (var wq = 0; wq < 3; wq++) {
            var wd = t - T.weekFill[wq], won = wd >= 0, sq2 = ws.children[wq];
            sq2.style.background = won ? COL.amber : "transparent"; sq2.style.borderColor = won ? COL.amber : "rgba(21,20,15,0.22)";
            sq2.style.transform = "scale(" + (won && wd < 0.3 ? 1 + 0.16 * Math.sin(Math.PI * wd / 0.3) : 1).toFixed(3) + ")";
          }
          // dark flip: the window has closed to a line; the dark opens out of it, as the window opened at the start
          var dk = F.eOut((t - T.darkA) / (T.darkB - T.darkA)), yc = 652;
          $("dark").style.clipPath = "inset(" + (yc * (1 - dk)).toFixed(1) + "px 0 " + ((1080 - yc) * (1 - dk)).toFixed(1) + "px 0)";
          $("glow").style.opacity = (0.30 * F.sstep((t - 16.7) / 1.6)).toFixed(3);
        }

        var ready = false;
        function render(t) {
          if (!ready) return;
          t = Math.max(0, Math.min(F.DUR, t));
          update(t);
          var actv = null; for (var mi = 0; mi < F.MORPHS.length; mi++) if (t > F.MORPHS[mi].t0 - 0.05 && t < F.MORPHS[mi].t1 + 0.05) actv = F.MORPHS[mi];
          var Rf = null; if (actv) { update(actv.t0); Rf = buildRoutes(); update(t); }     // the line leaves its old shape as it was when the move began
          var R = buildRoutes(t);
          if (!R.r3.fr) R.r3.fr = [A("achipL"), A("achk0"), A("achk1"), A("achk2")].map(function (p) { return fracOf(R.r3, p); });
          lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, 1920, 1080);
          // line canvas: a few sub-samples across the shutter (real blur on the fast parts)
          var fast = t > T.go - 0.02 && t < T.headDone + 0.1 || t > T.loopA && t < 4.6 || t > 7.6 && t < 8.8 || t > 11.5 && t < 12.9 || t > T.morphA - 0.1 && t < T.morphB + 0.1;
          var N = fast ? 10 : 1, sh = 1 / 240;
          for (var j = 0; j < N; j++) {
            var tj = N === 1 ? t : t + ((j + 0.5) / N - 0.5) * sh;
            lacx.setTransform(1, 0, 0, 1, 0, 0); lacx.clearRect(0, 0, 1920, 1080);
            var shape = drawLine(lacx, tj, R, Rf || R); drawPulse(lacx, tj, R, shape);
            if (N === 1) { lctx.drawImage(lacc, 0, 0); } else { lctx.globalAlpha = 1 / (j + 1); lctx.drawImage(lacc, 0, 0); lctx.globalAlpha = 1; }
          }
          if (t >= T.morphB && sc5) {                       // hand over to the exact logo scene
            lctx.clearRect(0, 0, 1920, 1080);
            fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, 1920, 1080);
            var NF = t < F.tfOf(S.T.close + 0.45) ? 6 : 1;
            for (var f = 0; f < NF; f++) {
              var tf = NF === 1 ? t : t + ((f + 0.5) / NF - 0.5) * sh;
              facx.setTransform(1, 0, 0, 1, 0, 0); facx.clearRect(0, 0, 1920, 1080); drawFinal(facx, tf);
              if (NF === 1) fctx.drawImage(facc, 0, 0); else { fctx.globalAlpha = 1 / (f + 1); fctx.drawImage(facc, 0, 0); fctx.globalAlpha = 1; }
            }
          } else { fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, 1920, 1080); }
        }

        var proxy = { t: 0 }, SUB = 1.5 / 240;             // the renderer asks for 240 fps; four frames are blended into one, centred on the 60 fps frame time
        var tl = gsap.timeline({ paused: true });
        tl.to(proxy, { t: F.DUR, duration: F.DUR, ease: "none", onUpdate: function () { render(proxy.t - (window.__still ? 0 : SUB)); } }, 0);
        window.addEventListener("hf-seek", function (ev) { render(ev.detail.time - (window.__still ? 0 : SUB)); });

        var fontsReady = Promise.all([
          'italic 500 54px Lora', '700 190px Oswald', '600 50px Inter', '500 30px Inter', '700 50px Inter', '600 20px "IBM Plex Mono"', '400 20px "IBM Plex Mono"'
        ].map(function (f) { return document.fonts.load(f); }));
        fontsReady.then(function () {
          sc5 = S.create("orbit", { targetW: 1500, comp0: 0.05 });
          (function () {                                   // a whisper of film grain on the dark, so the glow never bands
            var g = $("grain").getContext("2d"), im = g.createImageData(1920, 1080), d = im.data, r = F.rng(77);
            for (var k = 0; k < d.length; k += 4) { d[k] = 255; d[k + 1] = 250; d[k + 2] = 240; d[k + 3] = Math.floor(r() * 5); }
            g.putImageData(im, 0, 0);
          })();
          (function () {                                   // the soft amber glow behind the logo: a gaussian falloff with a little dither
            var g = $("glow").getContext("2d"), gr = g.createRadialGradient(960, 560, 0, 960, 560, 760);
            for (var i = 0; i <= 24; i++) { var u = i / 24; gr.addColorStop(u, S.rgba(COL.amber, 0.9 * Math.exp(-4.2 * u * u) * (1 - F.sstep((u - 0.82) / 0.18)))); }
            g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
            var im = g.getImageData(0, 0, 1920, 1080), d = im.data, r = F.rng(9);
            for (var k = 0; k < d.length; k += 4) { if (d[k + 3] > 0) { d[k + 3] = Math.max(0, Math.min(255, d[k + 3] + (r() - 0.5) * 3)); } }
            g.putImageData(im, 0, 0);
          })();
          measureText2();
          (function () { var tmp = [], NSt = 1400, bb = sc5.headS(2.3); for (var i = 0; i < NSt; i++) { var pp = sc5.ptAt(bb * i / (NSt - 1), sc5.comp(2.3)); tmp.push([pp.x, pp.y]); } tmp.reverse(); stingTarget = tmp; })();
          bandRow = makeRow(band, {
            font: '700 190px Oswald', track: 7, lh: 228, strings: F.bandStrings,
            trans: F.BAND, reveal: function (i, t, p) { var hx = F.lerp(-90, 2010, F.headX(t)); return F.clamp((hx - (p.x + 960 - p.w / 2)) / p.w); }
          });
          subRow = makeRow(subEl, {
            font: 'italic 500 112px Lora', track: 1, lh: 140, strings: [F.WORDS.sub, ""],
            trans: [{ t0: 3.3 }], reveal: function (i, t) { return F.SUB_T[i] <= t ? 1 : 0; }
          });
          // the sub row follows the band's flip: re-time its single transition by hand
          ready = true;
          window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; window.__render = render;
          if (q.get("still") !== null) { window.__still = true; render(parseFloat(q.get("still"))); document.title = "ready"; }
          else render(0);
        });
      })();
    </script>
