# Sends Be The Man's due series emails and broadcasts every hour.
# Needs the repository secret CRON_SECRET (Settings -> Secrets and variables ->
# Actions), set to the same value as CRON_SECRET in Cloudflare Pages.
name: Email scheduler
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS -X POST https://bethemansystem.com/api/mail/tick -H "x-cron-secret: $CRON_SECRET"
