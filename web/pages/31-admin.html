---
{
 "path": "/admin/",
 "bare": true,
 "noindex": true,
 "title": "Dashboard | Be The Man",
 "description": "The Be The Man dashboard."
}
---
<div class="adm">
  <header class="adm-top">
    <a class="logo" href="/">BE <span>THE MAN</span></a>
    <nav class="adm-tabs" aria-label="Dashboard">
      <button type="button" data-tab="overview">Overview</button>
      <button type="button" data-tab="men">Men <span class="dot-new" id="unreadp" hidden></span></button>
      <button type="button" data-tab="cohort">Cohort</button>
      <button type="button" data-tab="library">Library</button>
      <button type="button" data-tab="sessions">Sessions</button>
      <button type="button" data-tab="contacts">Contacts</button>
      <button type="button" data-tab="segments">Segments</button>
      <button type="button" data-tab="automations">Automations</button>
      <button type="button" data-tab="forms">Forms</button>
      <button type="button" data-tab="series">Email series</button>
      <button type="button" data-tab="broadcasts">Broadcasts</button>
      <button type="button" data-tab="texts">Texts <span class="dot-new" id="unread" hidden></span></button>
      <button type="button" data-tab="calls">Calls</button>
      <button type="button" data-tab="money">Money</button>
      <button type="button" data-tab="settings">Settings</button>
      <button type="button" data-tab="help">Setup and help</button>
      <a class="adm-mine" href="/portal/">My system</a>
    </nav>
  </header>
  <p class="adm-flash" id="flash" role="status" hidden></p>
  <main id="view"><p class="muted">Loading…</p></main>
  <dialog id="dlg"><div id="dlgbody"></div></dialog>
</div>
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/admin.js" defer></script>
<script src="/assets/admin-more.js" defer></script>
<script src="/assets/admin-portal.js" defer></script>
