# XcodeGen spec. On a Mac: `./open-in-xcode.sh` regenerates Keel.xcodeproj from this file.
# Xcode Cloud runs ci_scripts/ci_post_clone.sh, which does the same before every TestFlight build.
name: Keel
options:
  bundleIdPrefix: com.briangreenejr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"   # Foundation Models (Apple Intelligence) needs iOS 26+
settings:
  base:
    SWIFT_VERSION: "5.0"   # Xcode accepts 5.0 or 6.0 here; 5.0 = Swift 5 language mode
    DEVELOPMENT_TEAM: "NT3YQF6DM5" # set your Apple Developer team ID
targets:
  Keel:
    type: application
    platform: iOS
    sources: [Keel]
    dependencies:
      - target: KeelWidgets               # widgets + focus Live Activity, embedded in the app
      - target: KeelShare                 # "Save to Keel" in the share sheet
      - target: KeelWatch                 # Apple Watch companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel   # must be unique across all Apple developers
        MARKETING_VERSION: "0.1.0"          # the version people see
        CURRENT_PROJECT_VERSION: "1"        # build number; Xcode Cloud overrides it on every build
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Steady AppIcon-OneThing AppIcon-CheckK AppIcon-Sunset"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (an iPad build would need every rotation supported)
    entitlements:
      path: Keel/Keel.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Keel/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS, so TestFlight skips the export-compliance question
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing, audio]
        BGTaskSchedulerPermittedIdentifiers:
          - com.keel.sync.refresh
          - com.keel.sync.process
        NSCalendarsFullAccessUsageDescription: Keel shows your events next to your tasks and email so it can plan your day.
        NSRemindersFullAccessUsageDescription: Keel syncs with Apple Reminders so your tasks live in one place.
        NSCalendarsWriteOnlyAccessUsageDescription: Keel adds focus blocks and events you create to your calendar.
        NSCalendarsUsageDescription: Keel shows your events next to your tasks and email so it can plan your day.
        NSRemindersUsageDescription: Keel syncs with Apple Reminders so your tasks live in one place.
        NSContactsUsageDescription: Keel shows who's invited to your calendar events.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Keel reads your sleep to suggest today's energy, and steps, exercise and mindful minutes to tick off habits for you. Nothing is written to Health.
        NSPhotoLibraryUsageDescription: Keel reads your recent screenshots on this iPhone to suggest tasks, and lets you add photos to notes.
        NSLocationWhenInUseUsageDescription: Keel uses your location for today's weather, time-to-leave alerts for events, and finding places for location reminders.
        NSCameraUsageDescription: Keel uses the camera to scan documents into your notes.
        NSPhotoLibraryAddUsageDescription: Keel can save images from your notes to Photos.
        NSMicrophoneUsageDescription: Keel records meetings you choose to record and turns them into notes.
        NSSpeechRecognitionUsageDescription: Keel transcribes your meeting recordings on this iPhone.
        NSFaceIDUsageDescription: Keel uses Face ID to unlock the app and your locked notes.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.keel.app, com.googleusercontent.apps.893825511742-h5bgc5adfd9f9tf1m6g0dhi4m59ude6n]   # Google sign-in redirect
        KeelAIProxyURL: "https://YOUR-BACKEND.example.com/v1/messages"

  KeelWidgets:
    type: app-extension
    platform: iOS
    sources: [KeelWidgets, Keel/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: KeelWidgets/KeelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  KeelShare:
    type: app-extension
    platform: iOS
    sources: [KeelShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: KeelShare/KeelShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelShare/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10

  KeelWatch:
    type: application
    platform: watchOS
    sources: [KeelWatch, Keel/Shared/WatchShared.swift]
    dependencies:
      - target: KeelWatchWidgets          # watch-face complications
    entitlements:
      path: KeelWatch/KeelWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KeelWatch/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.briangreenejr.keel

  KeelWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [KeelWatchWidgets, Keel/Shared/WatchShared.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.watchkitapp.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: KeelWatchWidgets/KeelWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Keel:   # shared scheme, committed to the repo; Xcode Cloud only sees shared schemes
    build:
      targets:
        Keel: all
    run:
      config: Debug
    archive:
      config: Release
