# XcodeGen spec. On a Mac: `./open-in-xcode.sh` regenerates Keel.xcodeproj from this file.
# Xcode Cloud runs ci_scripts/ci_post_clone.sh, which does the same before every TestFlight build.
name: Keel
options:
  bundleIdPrefix: com.briangreenejr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"   # Foundation Models (Apple Intelligence) needs iOS 26+
settings:
  base:
    SWIFT_VERSION: "5.0"   # Xcode accepts 5.0 or 6.0 here; 5.0 = Swift 5 language mode
    DEVELOPMENT_TEAM: "NT3YQF6DM5" # set your Apple Developer team ID
targets:
  Keel:
    type: application
    platform: iOS
    sources: [Keel]
    dependencies:
      - target: KeelWidgets               # widgets + focus Live Activity, embedded in the app (Mac: widgets only)
      - target: KeelShare                 # "Save to Keel" in the share sheet (Mac too)
      - target: KeelWatch                 # Apple Watch companion
        platformFilter: iOS
      - target: KeelSafari                # Safari extension: save pages and highlights (KEEL_SAFARI)
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel   # must be unique across all Apple developers
        MARKETING_VERSION: "0.1.0"          # the version people see
        CURRENT_PROJECT_VERSION: "1"        # build number; Xcode Cloud overrides it on every build
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Steady AppIcon-OneThing AppIcon-CheckK AppIcon-Sunset"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad (full screen); iPad is also what the Mac app is built from
        SUPPORTS_MACCATALYST: YES            # the Mac app: the same Keel, built for macOS
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO   # same app record, so one purchase covers iPhone, iPad and Mac
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Keel/KeelMac.entitlements
    entitlements:
      path: Keel/Keel.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.time-sensitive: true                           # Time Sensitive reminders (break through Focus)
        com.apple.developer.icloud-container-identifiers: [iCloud.com.briangreenejr.keel]   # iCloud sync (KEEL_ICLOUD)
        com.apple.developer.icloud-services: [CloudKit]                                      # iCloud sync (KEEL_ICLOUD)
        aps-environment: development                                                         # iCloud sync (KEEL_ICLOUD): silent pushes; App Store builds use production
        com.apple.developer.applesignin: [Default]                                           # Sign in with Apple
    info:
      path: Keel/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS, so TestFlight skips the export-compliance question
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing, audio, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - com.keel.sync.refresh
          - com.keel.sync.process
        NSCalendarsFullAccessUsageDescription: Keel shows your events next to your tasks and email so it can plan your day.
        NSRemindersFullAccessUsageDescription: Keel syncs with Apple Reminders so your tasks live in one place.
        NSCalendarsWriteOnlyAccessUsageDescription: Keel adds focus blocks and events you create to your calendar.
        NSCalendarsUsageDescription: Keel shows your events next to your tasks and email so it can plan your day.
        NSRemindersUsageDescription: Keel syncs with Apple Reminders so your tasks live in one place.
        NSContactsUsageDescription: Keel shows who's invited to your calendar events.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationShortcutItems:                      # press and hold the app icon
          - UIApplicationShortcutItemType: com.keel.app.capture
            UIApplicationShortcutItemTitle: New Task
            UIApplicationShortcutItemIconSymbolName: plus.circle.fill
          - UIApplicationShortcutItemType: com.keel.app.note
            UIApplicationShortcutItemTitle: New Note
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: com.keel.app.focus
            UIApplicationShortcutItemTitle: Start Focus
            UIApplicationShortcutItemIconSymbolName: moon.zzz.fill
          - UIApplicationShortcutItemType: com.keel.app.record
            UIApplicationShortcutItemTitle: Record a Meeting
            UIApplicationShortcutItemIconSymbolName: waveform.badge.mic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true     # several Keel windows on Mac and iPad
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSHealthUpdateUsageDescription: When you turn it on, Keel saves the meals you log (calories, protein, carbs, fat, fiber, sugar, sodium and caffeine) to Health, and removes them if you delete them in Keel.
        NSHealthShareUsageDescription: Keel reads your sleep to suggest today's energy, steps, exercise and mindful minutes to tick off habits, and food other apps logged plus your weight for your nutrition totals and protein goal.
        NSPhotoLibraryUsageDescription: Keel reads your recent screenshots on this iPhone to suggest tasks, and lets you add photos to notes.
        NSLocationWhenInUseUsageDescription: Keel uses your location for today's weather, time-to-leave alerts for events, and finding places for location reminders.
        NSCameraUsageDescription: Keel uses the camera to scan documents into your notes and to scan food barcodes and labels to check them against your diet.
        NSPhotoLibraryAddUsageDescription: Keel can save images from your notes to Photos.
        NSMicrophoneUsageDescription: Keel records meetings you choose to record and turns them into notes.
        NSSpeechRecognitionUsageDescription: Keel transcribes your meeting recordings on this iPhone.
        NSAlarmKitUsageDescription: Keel shows full-screen alarms for tasks you choose, so important ones are impossible to miss.
        NSFaceIDUsageDescription: Keel uses Face ID to unlock the app and your locked notes.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.keel.app, com.googleusercontent.apps.893825511742-h5bgc5adfd9f9tf1m6g0dhi4m59ude6n]   # Google sign-in redirect
        KeelAIProxyURL: "https://keel-backend.bbritt2223.workers.dev/v1/messages"   # the deployed Keel server

  KeelTests:                      # automated tests: Xcode Cloud runs them with a Test action (iPhone simulator)
    type: bundle.unit-test
    platform: iOS
    sources: [KeelTests]
    dependencies:
      - target: Keel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  KeelWidgets:
    type: app-extension
    platform: iOS
    sources: [KeelWidgets, Keel/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": KeelWidgets/KeelWidgetsMac.entitlements
    entitlements:
      path: KeelWidgets/KeelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  KeelSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: KeelSafari/SafariWebExtensionHandler.swift
      - path: KeelSafari/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.safari
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: KeelSafari/KeelSafari.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelSafari/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler

  KeelShare:
    type: app-extension
    platform: iOS
    sources: [KeelShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": KeelShare/KeelShareMac.entitlements
    entitlements:
      path: KeelShare/KeelShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelShare/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10

  KeelWatch:
    type: application
    platform: watchOS
    sources: [KeelWatch, Keel/Shared/WatchShared.swift]
    dependencies:
      - target: KeelWatchWidgets          # watch-face complications
    entitlements:
      path: KeelWatch/KeelWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KeelWatch/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.briangreenejr.keel

  KeelWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [KeelWatchWidgets, Keel/Shared/WatchShared.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel.watchkitapp.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: KeelWatchWidgets/KeelWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
    info:
      path: KeelWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Keel:   # shared scheme, committed to the repo; Xcode Cloud only sees shared schemes
    build:
      targets:
        Keel: all
        KeelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KeelTests
    archive:
      config: Release
