# XcodeGen spec. On a Mac: `./open-in-xcode.sh` regenerates Keel.xcodeproj from this file.
# Xcode Cloud runs ci_scripts/ci_post_clone.sh, which does the same before every TestFlight build.
name: Keel
options:
  bundleIdPrefix: com.briangreenejr
  deploymentTarget:
    iOS: "26.0"   # Foundation Models (Apple Intelligence) needs iOS 26+
settings:
  base:
    SWIFT_VERSION: "5.0"   # Xcode accepts 5.0 or 6.0 here; 5.0 = Swift 5 language mode
    DEVELOPMENT_TEAM: "NT3YQF6DM5" # set your Apple Developer team ID
targets:
  Keel:
    type: application
    platform: iOS
    sources: [Keel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangreenejr.keel   # must be unique across all Apple developers
        MARKETING_VERSION: "0.1.0"          # the version people see
        CURRENT_PROJECT_VERSION: "1"        # build number; Xcode Cloud overrides it on every build
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Keel/Keel.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.briangreenejr.keel]
        aps-environment: development
    info:
      path: Keel/Info.plist
      properties:
        CFBundleDisplayName: Keel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS, so TestFlight skips the export-compliance question
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - com.keel.sync.refresh
          - com.keel.sync.process
        NSCalendarsFullAccessUsageDescription: Keel shows your events next to your tasks and email so it can plan your day.
        NSRemindersFullAccessUsageDescription: Keel syncs with Apple Reminders so your tasks live in one place.
        NSFaceIDUsageDescription: Keel locks your notes and mail behind Face ID.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.keel.app]
        KeelAIProxyURL: "https://YOUR-BACKEND.example.com/v1/messages"
schemes:
  Keel:   # shared scheme, committed to the repo; Xcode Cloud only sees shared schemes
    build:
      targets:
        Keel: all
    run:
      config: Debug
    archive:
      config: Release
