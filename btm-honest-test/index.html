        /* ---------- the line: the first bar becomes the thread that writes the logo ---------- */
        function octagon(c, cx, cy, s, col) { var a = s / 2, ch = s * 0.22; c.beginPath(); c.moveTo(cx - a + ch, cy - a); c.lineTo(cx + a - ch, cy - a); c.lineTo(cx + a, cy - a + ch); c.lineTo(cx + a, cy + a - ch); c.lineTo(cx + a - ch, cy + a); c.lineTo(cx - a + ch, cy + a); c.lineTo(cx - a, cy + a - ch); c.lineTo(cx - a, cy - a + ch); c.closePath(); c.fillStyle = col; c.fill(); }

            var u = i / (N - 1), m = L.eInOut(L.clamp((raw - 0.4 * u) / 0.6)), pa = a.at(u), pb = tg[Math.round(u * (tg.length - 1))];

        function measureAll() {

          measure.font = MONO_FONT; measure.letterSpacing = "3.2px"; var lab = L.WORDS.label + "   " + L.WORDS.url; labW = measure.measureText(lab).width; labAdv = []; for (var j = 0; j <= lab.length; j++) labAdv.push(measure.measureText(lab.slice(0, j)).width);
          measure.font = EX_FONT; measure.letterSpacing = "0.4px"; exW = measure.measureText(L.WORDS.example).width; exAdv = []; for (var e = 0; e <= L.WORDS.example.length; e++) exAdv.push(measure.measureText(L.WORDS.example.slice(0, e)).width);
